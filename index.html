<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry to Plate: 5-Day Meal Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf7f0;--card:#ffffff;--ink:#2b2420;--muted:#7a6e64;--accent:#c2562b;--accent-ink:#ffffff;--line:#eadfce;--soft:#f5ecdc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1815;--card:#26211d;--ink:#f1e9de;--muted:#a79a8c;--accent:#e07a4f;--accent-ink:#1c1815;--line:#3a322b;--soft:#2f2823}}
:root[data-theme="dark"]{--bg:#1c1815;--card:#26211d;--ink:#f1e9de;--muted:#a79a8c;--accent:#e07a4f;--accent-ink:#1c1815;--line:#3a322b;--soft:#2f2823}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:1.9rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-style:italic}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:bold;margin:0 0 6px;font-size:.95rem}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);margin-top:16px;width:100%}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);width:auto;margin:0;padding:8px 14px;font-size:.9rem}
#status{margin:16px 0;color:var(--muted);font-style:italic}
.err{color:#b3261e}
.day{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day h2{margin:0;padding:10px 16px;font-size:1.05rem;background:var(--soft);border-bottom:1px solid var(--line)}
.meal{padding:10px 16px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:bold}
.name{font-weight:bold}
.note{color:var(--muted);font-size:.92rem}
.shop{margin-top:14px;background:var(--card);border:1px dashed var(--accent);border-radius:14px;padding:14px 16px}
.shop h2{margin:0 0 6px;font-size:1.05rem}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}
.bar h2{margin:0;font-size:1.2rem}
</style>
</head>
<body>
<main>
<h1>Pantry to Plate</h1>
<p class="sub">Hand over your ingredients, and a five-day menu shall be conjured. No food was harmed in the making of this plan.</p>

<div class="panel">
<label for="ing">What is in your kitchen?</label>
<textarea id="ing" placeholder="rice, toor dal, onions, tomatoes, potatoes, eggs, curd, spinach, paneer, atta, chilli, curry leaves"></textarea>
<label for="avoid" style="margin-top:14px">Anything to avoid?</label>
<input id="avoid" type="text" maxlength="200" placeholder="e.g. peanuts, mushrooms, no dairy">
<div class="note" style="margin-top:6px">If you have a serious allergy, please double-check every ingredient yourself. An AI can slip up.</div>
<div class="row">
<div><label for="diet">Diet</label>
<select id="diet"><option>Non-vegetarian</option><option>Vegetarian</option><option>Eggetarian</option><option>Vegan</option></select></div>
<div><label for="cuisine">Cuisine leaning</label>
<select id="cuisine"><option>Anything goes</option><option>South Indian</option><option>North Indian</option><option>Light and healthy</option><option>Quick, under 30 minutes</option></select></div>
<div><label for="meals">Meals per day</label>
<select id="meals"><option value="3">Breakfast, lunch, dinner</option><option value="2">Lunch and dinner</option><option value="1">Dinner only</option></select></div>
</div>
<button id="go">Plan my 5 days</button>
</div>

<div id="status" role="status"></div>
<div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const out = $("out"), statusEl = $("status"), btn = $("go");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render(plan) {
  out.replaceChildren();
  const bar = el("div", "bar");
  bar.append(el("h2", null, "Your five days"));
  const copy = el("button", "ghost", "Copy plan");
  copy.onclick = () => {
    const lines = plan.days.map(d => d.day + "\n" + d.meals.map(m => "  " + m.type + ": " + m.dish).join("\n"));
    if (plan.shopping && plan.shopping.length) lines.push("\nTo buy: " + plan.shopping.join(", "));
    const text = lines.join("\n\n");
    try { navigator.clipboard.writeText(text).then(() => { copy.textContent = "Copied"; }); } catch (e) { copy.textContent = "Copy not allowed here"; }
  };
  bar.append(copy);
  out.append(bar);

  plan.days.forEach(d => {
    const day = el("section", "day");
    day.append(el("h2", null, d.day));
    d.meals.forEach(m => {
      const box = el("div", "meal");
      box.append(el("div", "tag", m.type));
      box.append(el("div", "name", m.dish));
      if (m.uses) box.append(el("div", "note", "Uses: " + m.uses));
      if (m.tip) box.append(el("div", "note", m.tip));
      day.append(box);
    });
    out.append(day);
  });

  if (plan.shopping && plan.shopping.length) {
    const s = el("section", "shop");
    s.append(el("h2", null, "Small shopping list"));
    s.append(el("div", "note", "Staples worth grabbing so the plan actually works: " + plan.shopping.join(", ") + "."));
    out.append(s);
  }
}

btn.onclick = async () => {
  const ingredients = $("ing").value.trim();
  if (!ingredients) { statusEl.className = "err"; statusEl.textContent = "An empty pantry, darling? Even I cannot cook with nothing."; return; }
  statusEl.className = ""; statusEl.textContent = "Consulting the kitchen oracle...";
  out.replaceChildren(); btn.disabled = true;
  try {
    const res = await fetch("/api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ingredients, diet: $("diet").value, avoid: $("avoid").value, cuisine: $("cuisine").value, meals: $("meals").value })
    });
    if (!res.ok) throw new Error("http " + res.status);
    const plan = await res.json();
    if (!plan || !Array.isArray(plan.days)) throw new Error("bad shape");
    statusEl.textContent = ""; render(plan);
  } catch (e) {
    statusEl.className = "err";
    statusEl.textContent = "The plan fell apart like a bad souffl\u00e9. Please try once more.";
  } finally { btn.disabled = false; }
};
</script>
</body>
</html>
